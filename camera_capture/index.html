<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:16px Arial,sans-serif;color:#173e2c}label{display:block;text-align:center;background:#009641;color:white;border-radius:8px;padding:22px;cursor:pointer;font-weight:bold}input{position:absolute;width:1px;height:1px;opacity:0}input:focus+label{outline:3px solid #ef8281}p{line-height:1.5;font-size:14px}img{max-width:100%;max-height:360px;object-fit:contain}img[hidden]{display:none}</style><input id="photo" type="file" accept="image/*" capture="environment"><label for="photo">Kamerafoto aufnehmen</label><p id="status" role="status">Fotografiere den gesamten QR-Code scharf und gerade. Das Foto wird zur Erkennung an die App übertragen, aber nicht dauerhaft gespeichert.</p><img id="preview" alt="Aufgenommenes QR-Foto" hidden><script>
const input=document.getElementById('photo'),status=document.getElementById('status'),preview=document.getElementById('preview');
function send(type,extra={}){parent.postMessage({isStreamlitMessage:true,type,...extra},'*')}
function height(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+12})}
input.onchange=async()=>{const file=input.files[0];if(!file)return;input.value='';try{if(file.size>20*1024*1024)throw Error('Das Foto ist zu gross. Bitte erneut mit geringerer Auflösung aufnehmen.');status.textContent='Foto wird geprüft …';const bitmap=await createImageBitmap(file),scale=Math.min(1,2000/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);bitmap.close();const photo=canvas.toDataURL('image/jpeg',.94);preview.src=photo;preview.hidden=false;preview.onload=height;send('streamlit:setComponentValue',{value:{photo,event:crypto.randomUUID()},dataType:'json'});height()}catch(e){status.textContent=e.message||'Foto nicht lesbar. Bitte erneut aufnehmen oder die Badge-ID eingeben.';height()}};
window.addEventListener('message',e=>{if(e.source===parent&&e.data?.type==='streamlit:render')height()});send('streamlit:componentReady',{apiVersion:1});height();
</script></html>
