<!doctype html><html lang="de"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:16px Arial,sans-serif;color:#173e2c;background:#fff}body{display:flex;flex-direction:column}.controls{display:flex;align-items:center;gap:10px;padding:8px 14px;border-bottom:1px solid #dce7df;flex-wrap:wrap;z-index:3;background:#fff}.controls strong{margin-right:auto}button{border:1px solid #b9cdbf;background:white;color:#173e2c;padding:9px 14px;border-radius:6px;cursor:pointer}#prepare{background:#009641;color:white;border:0}#status{font-size:12px}#stage{position:relative;flex:1;min-height:0}iframe{width:100%;height:100%;border:0}#show{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px;background:#fff;transition:background-color 1s ease,color 1s ease}#show.active{display:flex}#show.final{background:#ef8281;color:#291c1b}#show.winners{background:#003e25;color:white}#count{font-size:clamp(80px,23vh,230px);font-weight:750;font-variant-numeric:tabular-nums;line-height:1.1}#eyebrow{font-size:clamp(14px,2vw,24px);letter-spacing:.14em;text-transform:uppercase}#sub{font-size:clamp(16px,2vw,28px);max-width:850px}#badges{display:flex;justify-content:center;flex-wrap:wrap;gap:20px;margin:32px 0}#badges b{font-size:clamp(28px,5vw,80px);border-bottom:5px solid #ef8281;padding:16px;animation:arrive .7s ease-out both}#badges b:nth-child(2){animation-delay:.3s}#badges b:nth-child(3){animation-delay:.6s}#badges b:nth-child(4){animation-delay:.9s}#badges b:nth-child(5){animation-delay:1.2s}#ribbon{flex-shrink:0;text-align:center;background:#003e25;color:#fff;border-radius:8px;padding:10px 20px;white-space:nowrap}#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}#confetti i{position:absolute;width:9px;height:15px;top:-20px;background:#ef8281;animation:fall 3s ease-out both}#confetti i:nth-child(even){background:#a3e5b9}#show h2{font-size:clamp(30px,6vw,72px);margin:20px 0}@keyframes fall{to{transform:translateY(100vh) rotate(360deg);opacity:0}}@keyframes arrive{from{transform:translateY(25px) scale(.9);opacity:0}to{transform:none;opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#confetti{display:none}}
</style></head><body>
<div class="controls"><strong>AFJD · Live-Ziehung</strong><span id="status" role="status">Ton ist aus</span><button id="mute" aria-pressed="false">Ton einschalten</button><button id="prepare">Vollbild + Ton</button><button id="fullscreen">Vollbild</button></div>
<div id="stage"><iframe id="network" title="Anonymes Event-Netzwerk"></iframe><section id="show" aria-label="Live-Ziehung"><div id="confetti" aria-hidden="true"></div><div id="eyebrow"></div><div id="count"></div><h2 id="title"></h2><div id="badges"></div><p id="sub"></p><button id="back" hidden>Netzwerk anzeigen</button></section></div><div id="ribbon" hidden></div>
<script>
const el=id=>document.getElementById(id);
let args={}, html='', received=performance.now(), audio=null, enabled=false, lastSecond=null, resultKey='', dismissed='', lastUpdate=performance.now();
function send(type,extra){parent.postMessage({isStreamlitMessage:true,type,...extra},'*');}
async function enableAudio(){try{audio=audio||new (window.AudioContext||window.webkitAudioContext)();await audio.resume();enabled=audio.state==='running';}catch(e){enabled=false;}el('mute').textContent=enabled?'Ton ausschalten':'Ton einschalten';el('mute').setAttribute('aria-pressed',String(enabled));el('status').textContent=enabled?'Ton bereit · Finale ab fünf Minuten':'Ton konnte nicht aktiviert werden';}
function tone(freq,duration,delay=0){if(!enabled||!audio||audio.state!=='running')return;const osc=audio.createOscillator(), gain=audio.createGain(),at=audio.currentTime+delay;osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0,at);gain.gain.linearRampToValueAtTime(.09,at+.015);gain.gain.exponentialRampToValueAtTime(.001,at+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(at);osc.stop(at+duration+.02);}
async function fullscreen(){try{if(document.fullscreenElement){await document.exitFullscreen();}else{await document.documentElement.requestFullscreen();}}catch(e){el('status').textContent='Vollbild gesperrt: App im Browser öffnen und F11 drücken. Ton bleibt separat steuerbar.';}}
el('prepare').onclick=()=>{enableAudio();fullscreen();};el('fullscreen').onclick=fullscreen;
el('mute').onclick=()=>{if(enabled){enabled=false;if(audio)audio.suspend();el('mute').textContent='Ton einschalten';el('mute').setAttribute('aria-pressed','false');el('status').textContent='Ton ist aus';}else enableAudio();};
document.addEventListener('fullscreenchange',()=>{el('fullscreen').textContent=document.fullscreenElement?'Vollbild verlassen':'Vollbild';});
el('back').onclick=()=>{dismissed=resultKey;render();};
function render(){
 const draw=args.draw||{},key=String(draw.deadline||'')+'|'+String(args.epoch||0), now=(args.server_now||Date.now()/1000)+(performance.now()-received)/1000;
 const seconds=Math.max(0,Math.ceil((Date.parse(draw.deadline)-now*1000)/1000));
 const overlay=el('show');
 if(draw.status==='completed'){
   el('ribbon').hidden=true;
   const emptyExpired=!(draw.winner_badges||[]).length && now*1000-Date.parse(draw.resolved_at||draw.deadline)>=60000;
   if(emptyExpired) dismissed=key;
   if(resultKey!==key){resultKey=key;el('badges').replaceChildren();for(const badge of draw.winner_badges||[]){const b=document.createElement('b');b.textContent=badge;el('badges').append(b);}el('confetti').replaceChildren();if((draw.winner_badges||[]).length){for(let i=0;i<36;i++){const c=document.createElement('i');c.style.left=((i*29)%100)+'%';c.style.animationDelay=((i%9)*.1)+'s';el('confetti').append(c);}tone(523,.3);tone(659,.3,.2);tone(784,.6,.4);}}
   overlay.className=dismissed===key?'':'active winners';el('eyebrow').textContent='Die Ziehung ist abgeschlossen';el('count').textContent='';el('title').textContent=(draw.winner_badges||[]).length?'Herzlichen Glückwunsch!':'Keine berechtigten Teilnehmenden';el('sub').textContent=(draw.winner_badges||[]).length?'Kommt mit eurem Badge zum SVIAL-Stand.':'Bis zum Ziehungszeitpunkt wurde keine Teilnahmebedingung erfüllt.';el('back').hidden=false;return;
 }
 resultKey='';el('back').hidden=true;el('badges').replaceChildren();el('confetti').replaceChildren();
 if(draw.status!=='scheduled'){overlay.className='';el('ribbon').hidden=true;lastSecond=null;return;}
 if(seconds>300){overlay.className='';el('ribbon').hidden=false;el('ribbon').textContent='Ziehung in '+Math.floor(seconds/3600).toString().padStart(2,'0')+':'+Math.floor(seconds%3600/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');lastSecond=null;return;}
 el('ribbon').hidden=true;overlay.className=seconds<=30?'active final':'active';el('eyebrow').textContent='Gleich ist es so weit';el('count').textContent=seconds>0?(Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0')):'';el('title').textContent=seconds>0?'Die grosse AFJD-Ziehung':'Die Gewinner werden ermittelt …';el('sub').textContent=seconds>0?'Haltet eure Badges bereit!':(performance.now()-lastUpdate>10000?'Verbindung unterbrochen. Wir warten auf das gespeicherte Ergebnis.':'Das Ergebnis wird vom Event-Server bestätigt.');
 if(seconds>0&&lastSecond!==key+':'+seconds){lastSecond=key+':'+seconds;if(seconds<=30){const notes=[220,261.63,329.63,392];tone(notes[seconds%4],.22);tone(110,.18);if(seconds<=10){tone(notes[(seconds+2)%4]*2,.14,.25);tone(440,.1,.5);}}else if(seconds%10===0){tone(110,.4);tone(220,.25,.2);tone(329.63,.35,.4);}}
}
window.addEventListener('message',event=>{if(event.source!==parent||event.data.type!=='streamlit:render')return;args=event.data.args;received=performance.now();lastUpdate=received;if(args.html!==html){html=args.html;el('network').srcdoc=html.replace('</head>','<style>#fullscreen{display:none!important}</style></head>');}render();});
setInterval(render,100);send('streamlit:componentReady',{apiVersion:1});send('streamlit:setFrameHeight',{height:800});
</script></body></html>
